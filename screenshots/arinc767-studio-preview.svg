<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#studioBg)"/>

  <!-- Window Header -->
  <rect width="1000" height="50" fill="#111827" stroke="#1f293d" stroke-width="1"/>
  <circle cx="25" cy="25" r="6" fill="#f43f5e"/>
  <circle cx="45" cy="25" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="25" r="6" fill="#10b981"/>
  <text x="100" y="31" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">
    ARINC767Forge Pro — Enhanced Airborne Flight Recorder Studio (v1.0.0)
  </text>
  <rect x="740" y="14" width="235" height="24" rx="4" fill="rgba(249,115,22,0.15)" stroke="#f97316"/>
  <text x="857" y="30" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#f97316">
    ED-112A 25-HOUR RECORDING
  </text>

  <!-- Left: Controls & Telemetry -->
  <rect x="20" y="70" width="280" height="505" rx="6" fill="#111827" stroke="#1f293d"/>
  <text x="35" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">FLIGHT RECORDER CONTROLS</text>

  <rect x="35" y="120" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="142" font-family="sans-serif" font-size="12" fill="#e2e8f0">Monitored: Aft EAFR (Empennage)</text>

  <rect x="35" y="170" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="192" font-family="sans-serif" font-size="12" fill="#e2e8f0">Altitude: 37,000 ft | G-Load: 1.05g</text>

  <rect x="35" y="220" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="242" font-family="sans-serif" font-size="12" fill="#e2e8f0">Power: 28V DC Main Bus (Normal)</text>

  <rect x="35" y="270" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="292" font-family="sans-serif" font-size="12" fill="#e2e8f0">RIPS Battery: 10 Min Holdover Standby</text>

  <rect x="35" y="320" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="342" font-family="sans-serif" font-size="12" fill="#e2e8f0">ULB Beacon: 37.5 kHz Armed (90-Day)</text>

  <rect x="35" y="380" width="250" height="40" rx="4" fill="#ea580c"/>
  <text x="160" y="405" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">
    LOG TELEMETRY FRAME
  </text>

  <rect x="35" y="430" width="250" height="40" rx="4" fill="#dc2626"/>
  <text x="160" y="455" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">
    SIMULATE CRASH G-IMPACT (&gt;= 6g)
  </text>

  <!-- Center: 4-Channel CSMU Black Box Display -->
  <rect x="320" y="70" width="370" height="505" rx="6" fill="#111827" stroke="#1f293d"/>
  <text x="335" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">CSMU SYNCHRONIZED CHANNELS (ED-112A)</text>

  <!-- Visual Canvas -->
  <rect x="335" y="120" width="340" height="200" rx="4" fill="#080d1a" stroke="#1e293b"/>
  <!-- Orange Cylinder -->
  <rect x="350" y="145" width="80" height="110" rx="6" fill="#ea580c" stroke="#c2410c" stroke-width="2"/>
  <rect x="358" y="160" width="64" height="12" fill="#f97316"/>
  <text x="390" y="169" text-anchor="middle" fill="#ffffff" font-size="6" font-weight="bold" font-family="monospace">FLIGHT RECORDER</text>
  <rect x="432" y="180" width="18" height="25" rx="2" fill="#0284c7"/>

  <!-- 4 Channel Bars -->
  <rect x="460" y="135" width="200" height="35" rx="3" fill="#1e293b" stroke="#334155"/>
  <text x="470" y="150" fill="#38bdf8" font-size="9" font-weight="bold" font-family="monospace">CH 1: FLIGHT DATA (FDR)</text>
  <text x="470" y="162" fill="#94a3b8" font-size="8" font-family="monospace">1024 WPS | 37,000 FT | 1.05 G</text>

  <rect x="460" y="175" width="200" height="35" rx="3" fill="#1e293b" stroke="#334155"/>
  <text x="470" y="190" fill="#10b981" font-size="9" font-weight="bold" font-family="monospace">CH 2: COCKPIT VOICE (CVR)</text>
  <text x="470" y="202" fill="#94a3b8" font-size="8" font-family="monospace">4 AUDIO CHANNELS | 25 HOURS</text>

  <rect x="460" y="215" width="200" height="35" rx="3" fill="#1e293b" stroke="#334155"/>
  <text x="470" y="230" fill="#a855f7" font-size="9" font-weight="bold" font-family="monospace">CH 3: DATA LINK (DLR)</text>
  <text x="470" y="242" fill="#94a3b8" font-size="8" font-family="monospace">FANS 1/A CPDLC &amp; ADS-C</text>

  <rect x="460" y="255" width="200" height="35" rx="3" fill="#1e293b" stroke="#334155"/>
  <text x="470" y="270" fill="#f59e0b" font-size="9" font-weight="bold" font-family="monospace">CH 4: AIRBORNE IMAGE (AIR)</text>
  <text x="470" y="282" fill="#94a3b8" font-size="8" font-family="monospace">1080P DISPLAY SCREENSHOTS</text>

  <text x="335" y="350" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">ARINC 429 EAFR BUS WORDS (ATTACHMENT 2)</text>
  <rect x="335" y="370" width="340" height="185" rx="4" fill="#090e18" stroke="#1e293b"/>
  <text x="350" y="395" font-family="monospace" font-size="11" fill="#38bdf8">270 EAFR STATUS  : 0x6010001D (NORMAL_REC)</text>
  <text x="350" y="425" font-family="monospace" font-size="11" fill="#38bdf8">203 FDR ALTITUDE : 0x828CE843 (37,000 FT)</text>
  <text x="350" y="455" font-family="monospace" font-size="11" fill="#10b981">370 NORMAL G-LOAD: 0x60010078 (+1.05 G)</text>
  <text x="350" y="485" font-family="monospace" font-size="11" fill="#10b981">377 EQUIP IDENT  : 0x805047FF (EAFR-AFT)</text>
  <text x="350" y="515" font-family="monospace" font-size="11" fill="#ea580c">CSMU STATUS      : 25.0 HRS CIRCULAR BUFFER</text>

  <!-- Right: Auditor -->
  <rect x="710" y="70" width="270" height="505" rx="6" fill="#111827" stroke="#1f293d"/>
  <text x="725" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">10-POINT NORMATIVE AUDIT</text>

  <g transform="translate(725, 120)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">1. Dual FWD/AFT EAFR Units</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 160)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">2. ED-112A 25-Hour Buffer</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 200)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">3. 4-Channel CSMU Multiplex</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 240)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">4. TSO-C155a RIPS 10-Min</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 280)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">5. TSO-C121b ULB 37.5kHz</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 320)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">6. Crash G-Switch (&gt;= 6.0g)</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 360)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">7. ARINC 664 AFDX Ingestion</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 400)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">8. ARINC 429 Bit 32 Parity</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 440)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">9. SSM Normal Recording</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 480)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">10. Boeing/Airbus Interop</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
</svg>